<main class="page-shell"><header class="page-heading"><p class="eyebrow">급여·근로</p><h1>실업급여 계산기</h1><p class="lead">평균임금과 고용보험 가입기간을 입력하면 구직급여일액과 총 예상수령액을 계산합니다.</p></header>
<form id="unemployment-benefit-form" class="panel"><div class="tabs" role="radiogroup" aria-label="평균임금 입력 방식"><label class="choice-card"><input type="radio" name="wageMode" value="daily" checked><span class="choice-copy"><strong>1일 평균임금</strong></span></label><label class="choice-card"><input type="radio" name="wageMode" value="threeMonth"><span class="choice-copy"><strong>3개월 총액 환산</strong></span></label></div><div id="daily-wage-fields"><div class="field"><label for="average-daily-wage">이직 전 1일 평균임금</label><div class="input-wrap"><input id="average-daily-wage" name="averageDailyWage" value="150,000" inputmode="numeric" data-number><span class="unit">원</span></div></div></div><div id="three-month-fields" hidden><div class="field"><label for="total-wages">이직 전 3개월 임금 총액</label><div class="input-wrap"><input id="total-wages" name="totalWages" value="13,500,000" inputmode="numeric" data-number><span class="unit">원</span></div></div><div class="field"><label for="wage-days">산정 기간 총 일수</label><div class="input-wrap"><input id="wage-days" name="wageDays" value="90" inputmode="numeric" data-number><span class="unit">일</span></div></div></div><div class="field"><label for="unemployment-age">이직 당시 나이</label><div class="input-wrap"><input id="unemployment-age" name="age" value="32" inputmode="numeric" data-number><span class="unit">세</span></div></div><div class="field"><label for="insured-years">고용보험 가입기간</label><div class="input-wrap"><input id="insured-years" name="insuredYears" value="4" inputmode="numeric" data-number><span class="unit">년</span></div></div><div class="field"><label for="insured-months">추가 개월</label><div class="input-wrap"><input id="insured-months" name="insuredMonths" value="0" inputmode="numeric" data-number><span class="unit">개월</span></div></div><label class="choice-card"><input name="disabled" type="checkbox" value="1"><span class="choice-copy"><strong>장애인에 해당합니다</strong></span></label></form>
